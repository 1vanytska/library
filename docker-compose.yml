version: '3.8'

services:
  db:
    image: postgres:15
    container_name: library_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0987
      POSTGRES_DB: library_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: books_api
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0987
      POSTGRES_DB: library_db
      POSTGRES_HOST: db
    volumes:
      - .:/app
    command: python run.py

  locust:
    image: locustio/locust
    container_name: locust_container
    depends_on:
      - api
    ports:
      - "8089:8089"
    volumes:
      - ./locustfile.py:/mnt/locust/locustfile.py
    command: -f /mnt/locust/locustfile.py --host=http://api:5000

volumes:
  pg_data:
